apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: run-unit-tests
spec:
  workspaces:
    - name: source
  steps:
    - name: install-deps
      image: node:16-alpine
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        echo "Installing npm dependencies..."
        npm install

    - name: run-jasmine-tests
      image: node:16-alpine
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        echo "Running Jasmine unit tests..."
        npx jasmine